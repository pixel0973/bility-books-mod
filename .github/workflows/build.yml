name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build
        run: |
          cd "$(dirname "$(find . -name build.gradle | head -n1)")"
          gradle build
          mkdir -p "$GITHUB_WORKSPACE/out"
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} "$GITHUB_WORKSPACE/out/" \;
      - uses: actions/upload-artifact@v4
        with:
          name: abilitybooks-mod
          path: out/*.jar
          
